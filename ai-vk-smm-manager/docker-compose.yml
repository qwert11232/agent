services:
  db:
    image: postgres:16-alpine
    container_name: smm-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: smm-bot-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      # Необязательно: ключи можно не класть сюда, а вписать в веб-настройках
      # OPENAI_API_KEY: ""
      # GROQ_API_KEY: ""
      # GROQ_MODEL: "openai/gpt-oss-120b"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
